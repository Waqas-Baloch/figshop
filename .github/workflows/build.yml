# Builds the Figshop desktop installers on real runners and publishes a Release.
#
#  • workflow_dispatch → builds installers, uploads them as artifacts.
#  • push tag vX.Y.Z    → builds, then publishes ONE GitHub Release with both
#                         the macOS .dmg and Windows .exe attached.
#
# Each OS builds its own installer (cross-building isn't reliable). Publishing is
# done once in a separate job — no parallel-publish race, and a real (non-draft)
# release. Builds are unsigned unless you add the signing secrets:
#   macOS  : MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD, APPLE_ID,
#            APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
name: build-desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flag: mac
          - os: windows-latest
            flag: win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # Invoke electron-builder's CLI directly via node. The npm/npx/.cmd shims
      # silently no-op on Windows runners (no output, exit 0, no build); calling
      # node on cli.js bypasses all of them and runs identically on both OSes.
      - run: npm run prep
      - run: node node_modules/electron-builder/cli.js --${{ matrix.flag }} --publish never
      - run: node -e "console.log('dist contents:', require('fs').readdirSync('dist'))"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.flag }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
          if-no-files-found: error # fail loudly if the installer wasn't produced

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # required to sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: ls -R artifacts
      - name: SHA-256 checksums
        run: |
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) -print0 \
            | xargs -0 sha256sum | sed 's|artifacts/[^/]*/||' | tee SHA256SUMS.txt
      # Cryptographically ties each installer to this repo + commit + workflow,
      # so users can prove the binary came from this source and wasn't swapped.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'artifacts/installer-mac/*.dmg, artifacts/installer-win/*.exe'
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Figshop companion app installers."
            echo ""
            echo "The bridge listens on loopback only (127.0.0.1) and requires a pairing"
            echo "code before it accepts any command."
            echo ""
            echo "First launch — macOS: right-click ▸ Open. Windows: More info ▸ Run anyway."
            echo "(Unsigned; see the repo for notarization status.)"
            echo ""
            echo "### SHA-256"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo ""
            echo "### Verify build provenance"
            echo '```'
            echo "gh attestation verify <downloaded-file> --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Figshop ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            artifacts/installer-mac/*.dmg artifacts/installer-win/*.exe SHA256SUMS.txt
